[package]
name = "phase"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for the phase.rs Magic: The Gathering rules engine"
repository = "https://github.com/phase-rs/phase"

[lib]
name = "phase"
crate-type = ["cdylib"]

[dependencies]
engine = { package = "phase-engine", git = "https://github.com/phase-rs/phase" }
pyo3 = { git = "https://github.com/pyo3/pyo3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
extension-module = ["pyo3/extension-module"]
# Embeds introspection data in the cdylib so `maturin generate-stubs` can emit `phase.pyi`.
experimental-inspect = ["pyo3/experimental-inspect"]

[profile.release]
# Automatically strip symbols from the binary.
strip = true
debug = false

[profile.slim]
inherits = "release"
# Enable link-time optimization so the linker can remove unused code.
lto = true
# Use a single codegen unit so the optimizer can see all code at once.
codegen-units = 1
